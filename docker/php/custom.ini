; Batas upload sesuai persyaratan sistem aplikasi
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M

; Zona waktu
date.timezone = Asia/Jakarta

; Error reporting untuk produksi
display_errors = Off
log_errors = On

; Optimasi OPcache sesuai benchmark README.md
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1

