server {
    listen 80;
    server_name worksblue.my.id localhost;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 25M;

    # Front controller CodeIgniter
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Folder terlarang yang tidak boleh diakses publik
    location ^~ /application/ { deny all; }
    location ^~ /system/      { deny all; }
    location ^~ /stmi.ac.id-clone/ { deny all; }
    location ~ /\.git         { deny all; }

    # Blokir eksekusi skrip berbahaya di folder unggahan media
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ {
        deny all;
    }

    # Header keamanan standar
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript
               application/json image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Cache aset statis 30 hari (wp-content, wp-includes, assets)
    location ~* ^/(wp-content|wp-includes|assets)/.+\.(css|js|jpe?g|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    # Handler PHP-FPM
    location ~ \.php$ {
        # Hindari kompresi pada /admin untuk mitigasi serangan BREACH
        if ($request_uri ~ "^/admin(/|\?|$)") { gzip off; }

        # Buang header duplikat dari PHP karena sudah diset di level Nginx
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Content-Security-Policy;
        fastcgi_hide_header Permissions-Policy;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Timeout FastCGI
        fastcgi_read_timeout 180s;
    }
}

